[project]
name = "word-agent"
version = "0.1.0"
description = "Open source SDK for building LLM agents that draft and edit Microsoft Word (.docx) documents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["docx", "word", "agent", "llm", "ooxml"]
dependencies = [
    "lxml>=5.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
word-agent = "word_agent.cli:main"
word-agent-ui = "word_agent.ui.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/word_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
