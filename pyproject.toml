[project]
name = "docx-harness-quickstart"
version = "0.1.0"
description = "Starter kit for LLM agents that draft and edit Microsoft Word (.docx) documents: document abstraction, tools, and an async harness with plan mode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["docx", "word", "agent", "llm", "ooxml", "tool-calling", "agent-harness", "openrouter"]
dependencies = [
    "lxml>=5.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/zaneil/docx-harness-quickstart"
Documentation = "https://github.com/zaneil/docx-harness-quickstart/blob/main/README.md"
"Task guide" = "https://github.com/zaneil/docx-harness-quickstart/blob/main/docs/use-cases.md"
Issues = "https://github.com/zaneil/docx-harness-quickstart/issues"

[project.scripts]
docx-harness = "docx_harness.cli:main"
docx-harness-ui = "docx_harness.ui.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docx_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
